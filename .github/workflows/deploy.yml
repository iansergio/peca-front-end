# Lint e build em todo PR para a main; em push na main, publica a imagem no
# GHCR e atualiza o Azure Container Apps. Configuração e rollback: docs/deploy-azure.md.
name: Verificação e deploy no Azure Container Apps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEM: ghcr.io/iansergio/peca-front-end
  GRUPO_RECURSOS: rg-peca-app
  CONTAINER_APP: peca-web

jobs:
  verificacao:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  deploy:
    needs: verificacao
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Um deploy por vez; um push novo espera o anterior terminar.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write # login no Azure por OIDC, sem senha guardada no GitHub
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Atualiza o Container App
        run: |
          az extension add --name containerapp --upgrade --yes
          az containerapp update -g "$GRUPO_RECURSOS" -n "$CONTAINER_APP" --image "$IMAGEM:${{ github.sha }}"
