# Build e deploy do front no Azure App Service (Linux, Node 24) - peca-front-end.
# O pacote é só o `.next/standalone` (server.js + node_modules mínimos), com
# `.next/static` e `public` copiados para dentro; o App Service roda `node server.js`.
# Configuração do App Service e rollback: docs/deploy-azure.md.

name: Build e deploy no Azure App Service - peca-front-end

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Um deploy por vez; um push novo não cancela o deploy em andamento.
concurrency:
  group: deploy-peca-front-end
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Instalar dependências e build
        run: |
          npm ci
          npm run build

      - name: Montar pacote standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          # `public` não está no git quando vazio: copia só se existir.
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Zipa o conteúdo do standalone, incluindo a pasta oculta `.next`.
          # Os .env ficam de fora: as variáveis vêm das App Settings.
          cd .next/standalone
          zip -q -r ../../release.zip . -x '.env*'

      - name: Enviar artefato para o job de deploy
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: release.zip
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # Não usar `environment:` aqui sem antes criar a credencial federada
    # correspondente no Azure: com ele, o subject do OIDC passa a ser
    # `environment:<nome>` e o login deixa de casar com a credencial atual
    # (`ref:refs/heads/main`). Ver docs/deploy-azure.md.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artefato do build
        uses: actions/download-artifact@v8
        with:
          name: node-app

      - name: Login no Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_320C609312F84A05B3BFDB06C21F2682 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_49AA0C6C791B48C49E9F128FEA093909 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1D04B07F44D94D918F142928DD13189F }}

      - name: Deploy no Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'peca-front-end'
          slot-name: 'Production'
          package: release.zip
